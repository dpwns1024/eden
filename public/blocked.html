<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>접근 제한</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0b0e13;color:#c9d1dc;font-family:system-ui,-apple-system,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  body{display:grid;place-items:center;padding:16px;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  .box{max-width:420px;text-align:center;border:1px solid #2a323e;padding:34px 26px;background:#10141b}
  .tag{font-size:11px;letter-spacing:.32em;color:#d11c20;margin-bottom:14px}
  h1{font-size:18px;font-weight:700;margin:0 0 10px;color:#e8edf3}
  p{font-size:13.5px;line-height:1.8;margin:0 0 22px;color:#8e99a8}
  a{display:inline-block;padding:9px 22px;border:1px solid #607ca0;color:#e8edf3;text-decoration:none;font-size:13px;letter-spacing:.08em}
  a:hover{background:#607ca0}
</style>
</head>
<body oncontextmenu="return false">
  <div class="box">
    <div class="tag">ACCESS RESTRICTED</div>
    <h1>개발자 도구가 감지되었습니다</h1>
    <p>이 사이트의 글과 이미지는 개발자 도구로 열람할 수 없습니다.<br>개발자 도구를 닫은 뒤 다시 접속해 주세요.</p>
    <a href="/">다시 접속</a>
  </div>
</body>
</html>
